name: Preciser
description: >-
  Preciser is an AI and computer-vision sports analytics platform that
  automatically converts basketball and baseball game footage into statistics,
  trends, and player insights, removing the traditionally manual work of video
  tagging. Its three-part product covers Capture (InstaStats converts video to
  stats), Analyze (a Data Management System that generates statistics and
  insights), and Monetize (APIs that expose live stats feeds and widgets). The
  Preciser API advertises game chart-data and opponent-team-data endpoints under
  https://plg-api.preciser.io/v1. The company reports roughly 85% average
  accuracy, a two-hour average turnaround per game, and 10x faster analysis than
  manual tagging. Preciser is backed by 500 Global and the NVIDIA Inception
  Program.
